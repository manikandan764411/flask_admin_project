<!DOCTYPE html>
<html lang="en">

<head>
  <!-- Required meta tags -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>{% block title %}Admin Title{% endblock %}</title>
  <!-- plugins:css -->
  <link rel="stylesheet" href="{{ url_for('static', filename='admin/vendors/css/bootstrap.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='admin/vendors/css/vendor.bundle.base.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='admin/vendors/mdi/css/materialdesignicons.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='admin/vendors/feather/feather.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='admin/vendors/ti-icons/css/themify-icons.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='admin/vendors/font-awesome/css/font-awesome.min.css') }}">
  <!-- endinject -->
  <!-- Plugin css for this page -->
  <link rel="stylesheet"
    href="{{ url_for('static', filename='admin/vendors/datatables.net-bs5/dataTables.bootstrap5.css') }}">
  <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='admin/js/select.dataTables.min.css') }}">
  <!-- End plugin css for this page -->
  <!-- inject:css -->
  <link rel="stylesheet" href="{{ url_for('static', filename='admin/css/vertical-layout-dark/style.css') }}?v=1.0">
  <!-- endinject -->
  <link rel="shortcut icon" href="{{ url_for('static', filename='admin/images/favicon.png') }}" />
  {% block extra_css %}{% endblock %}
</head>

<body>
  <div class="container-scroller">
 

    <!-- Header/Navbar -->
    {% include 'admin/partials/header.html' %}

    <div class="container-fluid page-body-wrapper">
      <!-- Settings Panel -->
      {% include 'admin/partials/settings_panel.html' %}

      <!-- Sidebar -->
      {% include 'admin/partials/sidebar.html' %}

      <!-- Main Content -->
      <div class="main-panel">
        <div class="content-wrapper">
          {% block content %}{% endblock %}
        </div>
        <!-- content-wrapper ends -->

        <!-- Footer -->
        {% include 'admin/partials/footer.html' %}
      </div>
      <!-- main-panel ends -->
    </div>
    <!-- page-body-wrapper ends -->
  </div>
  <!-- container-scroller -->

  <!-- plugins:js -->
  <script src="{{ url_for('static', filename='admin/vendors/js/vendor.bundle.base.js') }}"></script>
  <!-- endinject -->
  <!-- Plugin js for this page -->
  <script src="{{ url_for('static', filename='admin/vendors/chart.js/chart.umd.js') }}"></script>
  <script src="{{ url_for('static', filename='admin/vendors/datatables.net/jquery.dataTables.js') }}"></script>
  <script src="{{ url_for('static', filename='admin/vendors/datatables.net-bs5/dataTables.bootstrap5.js') }}"></script>
  <script src="{{ url_for('static', filename='admin/js/dataTables.select.min.js') }}"></script>
  <!-- End plugin js for this page -->
  <!-- inject:js -->
  <script src="{{ url_for('static', filename='admin/js/off-canvas.js') }}"></script>
  <script src="{{ url_for('static', filename='admin/js/hoverable-collapse.js') }}"></script>
  <script src="{{ url_for('static', filename='admin/js/template.js') }}"></script>
  <script src="{{ url_for('static', filename='admin/js/settings.js') }}"></script>
  <script src="{{ url_for('static', filename='admin/js/todolist.js') }}"></script>
  <!-- endinject -->
  <!-- Custom js for this page-->
  <script src="{{ url_for('static', filename='admin/js/jquery.cookie.js') }}" type="text/javascript"></script>
  <script>
    // Set DataTable data URL for dashboard-dark.js
    window.dataTableUrl = "{{ url_for('static', filename='admin/js/data.txt') }}";
  </script>
  <script src="{{ url_for('static', filename='admin/js/dashboard-dark.js') }}"></script>

  <!-- <script src="{{ url_for('static', filename='admin/vendors/js/vendor.bundle.base.js') }}"></script> -->

  <!-- End custom js for this page-->
  {% block extra_js %}{% endblock %}
</body>

</html>
